name: Deploy Homepage Only

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '.github/workflows/deploy-homepage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rumahweb-homepage
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate homepage source
        run: |
          test -s index.html
          grep -q "Signage yang membuat usaha" index.html
          grep -q "Pilih konteks proyek Anda" index.html
          grep -q "PORTOFOLIO TERPILIH" index.html
          grep -q "BRIEF CEPAT" index.html
          grep -q "homepage-conversion-v100" index.html

      - name: Prepare homepage deployment
        run: |
          rm -rf homepage-deploy
          mkdir -p homepage-deploy
          cp index.html homepage-deploy/index.html

      - name: Upload homepage to Rumahweb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./homepage-deploy/
          server-dir: public_html/
          dangerous-clean-slate: false
          log-level: standard
