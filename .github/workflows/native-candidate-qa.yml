name: Native candidate browser QA
on:
  pull_request:
    paths:
      - "public_html/index.html"
      - "public_html/projects.html"
      - "public_html/assets/ui/**"
      - "public_html/assets/branding/**"
      - "tests/native-qa.cjs"
      - "tests/performance.cjs"
      - "tests/native-dependencies.json"
      - "tests/branding.test.cjs"
      - "scripts/prepare_native_qa.py"
      - "tests/test_native_dependencies.py"
      - ".github/workflows/native-candidate-qa.yml"
permissions:
  contents: read
jobs:
  native-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QA_BASE_URL: http://127.0.0.1:8765
      QA_ARTIFACT_DIR: artifacts/native-qa
      QA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Use the pinned supported Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.3'
          check-latest: false
          package-manager-cache: false
      - name: Verify exact candidate and original branding bytes
        run: |
          test "$(git rev-parse HEAD)" = "$QA_CANDIDATE_SHA"
          node --version
          python3 --version
          node --check tests/webp-derivative-guard.cjs
          node tests/webp-derivative-guard.test.cjs
          node tests/branding.test.cjs
          node --check tests/native-qa.cjs
          python3 -m py_compile scripts/prepare_native_qa.py
          python3 -m unittest discover -s tests -p "test_native_dependencies.py" -v
      - name: Install pinned Chromium test runtime
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/3dkan-chromium"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/3dkan-native-qa" --no-audit --no-fund playwright@1.64.0
          "$RUNNER_TEMP/3dkan-native-qa/node_modules/.bin/playwright" install --with-deps chromium
          printf 'NODE_PATH=%s\n' "$RUNNER_TEMP/3dkan-native-qa/node_modules" >> "$GITHUB_ENV"
      - name: Prepare public read-only dependencies with TLS and integrity checks
        run: python3 scripts/prepare_native_qa.py
      - name: Run native QA against isolated loopback server
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory artifacts/native-qa/fixture > "$RUNNER_TEMP/3dkan-native-server.log" 2>&1 &
          qa_server_pid=$!
          trap 'kill "$qa_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 1 "$QA_BASE_URL/" >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/native-qa.cjs
      - name: Select proportionate performance checks
        id: performance_scope
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          base = "a73bf893cd1db6d432f584f2bece74b955f94b95"
          expected = {
              "public_html/seo.php": "34a38413f774475a99aae9ad15bdc91d73416bfc1b1d601db6e03c0a6378dff7",
              "public_html/includes/refresh-data.json": "fa323534c3baec1cda60916413489868e7527cf765380ed2d66a1034886f14bb",
              "public_html/projects.html": "73a3b7a09cfa7ef8393e65471cc95051a33ef62311b880068f589a0131c9083a",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD", "--", "public_html"]).decode().splitlines())
          protected = ["tests/performance.cjs", "scripts/prepare_native_qa.py", "tests/native-dependencies.json"]
          stable = subprocess.run(["git", "diff", "--quiet", base, "HEAD", "--", *protected]).returncode == 0
          focused = stable and changed == set(expected) and all(hashlib.sha256(Path(p).read_bytes()).hexdigest() == h for p, h in expected.items())
          shared = False
          manifest_path = Path("docs/shared-brand-build.json")
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text())
              shared_base = "${{ github.event.pull_request.base.sha }}"
              shared_changed = set(subprocess.check_output(["git", "diff", "--name-only", shared_base, "HEAD", "--", "public_html"]).decode().splitlines())
              shared_owned = {entry["path"] for entry in manifest.get("outputs", [])} | {"public_html/assets/ui/design-system.css", "public_html/assets/marketing-20261006/site.js", "public_html/assets/refresh-20261006/site-v2.js", "public_html/assets/refresh-20261006/site.js"}
              # One explicitly reviewed BRMP service-data delta may join SharedBrand's owned paths.
              data_path = Path("public_html/includes/refresh-data.json")
              approval_path = Path("tests/fixtures/projects-approved-content.json")
              approved_data = False
              if (data_path.is_file() and not data_path.is_symlink()
                      and hashlib.sha256(data_path.read_bytes()).hexdigest() == "cffc9ff8a9f02ceac7bfd19054bbdca581b486e6ed311516ab03d584497d9d4e"
                      and approval_path.is_file() and not approval_path.is_symlink()
                      and hashlib.sha256(approval_path.read_bytes()).hexdigest() == "dcef03b2601f61bb80a9b3de2a3480fba1cae2e2da74780737ce5bbd1b388110"):
                  approval = json.loads(approval_path.read_text(encoding="ascii"))
                  spec = approval.get("service_data", {})
                  operations = spec.get("operations", [])
                  unchanged_home_assets_and_benchmark = subprocess.run(
                      ["git", "diff", "--quiet", shared_base, "HEAD", "--",
                       "public_html/index.html", "public_html/assets", "tests/performance.cjs"]).returncode == 0
                  old_data = subprocess.run(
                      ["git", "show", shared_base + ":public_html/includes/refresh-data.json"],
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  if (spec.get("path") == "public_html/includes/refresh-data.json"
                          and spec.get("service") == "huruf-timbul" and len(operations) == 1
                          and old_data.returncode == 0 and unchanged_home_assets_and_benchmark):
                      raw = data_path.read_bytes()
                      text = raw.decode("utf-8")
                      operation = operations[0]
                      if text.count(operation["new"]) == 1:
                          restored = text.replace(operation["new"], operation["old"], 1).encode("utf-8")
                          before = json.loads(restored)
                          editorial = spec["editorial"]
                          record = before["services"]["huruf-timbul"]
                          approved_data = (restored == old_data.stdout
                              and len(restored) == 23211
                              and hashlib.sha256(restored).hexdigest() == "fa323534c3baec1cda60916413489868e7527cf765380ed2d66a1034886f14bb"
                              and len(record) == 7 and len(before["services"]) == 7
                              and set(editorial) == {"seo_title", "seo_description", "detail_sections"}
                              and not set(editorial).intersection(record))
                          if approved_data:
                              before["services"]["huruf-timbul"].update(editorial)
                              approved_data = json.loads(raw) == before
                          if approved_data:
                              shared_owned.add("public_html/includes/refresh-data.json")
              benchmark_stable = subprocess.run(["git", "diff", "--quiet", shared_base, "HEAD", "--", "tests/performance.cjs", "tests/native-dependencies.json"]).returncode == 0
              if not benchmark_stable:
                  # Only the released c700 SharedBrand JS snapshot may replace its stale live pin.
                  old_snapshot = subprocess.run(["git", "show", shared_base + ":tests/native-dependencies.json"],
                                                stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
                  old_entry = b'"path": "/assets/marketing-20261006/site.js",\n      "bytes": 10787,\n      "sha256": "c77831ec62e22b7b9a01d7a748fe80e4119b3ed461906e32383527e80e498255"'
                  new_entry = b'"path": "/assets/marketing-20261006/site.js",\n      "bytes": 10892,\n      "sha256": "baf0918036519d5d847d41ee812c5f7823823a41158973d999e9ce317cfa0c5d"'
                  unchanged_home_assets_and_benchmark = subprocess.run(
                      ["git", "diff", "--quiet", shared_base, "HEAD", "--",
                       "public_html/index.html", "public_html/assets", "tests/performance.cjs"]).returncode == 0
                  benchmark_stable = (
                      old_snapshot.returncode == 0 and old_snapshot.stdout.count(old_entry) == 1
                      and Path("tests/native-dependencies.json").read_bytes()
                          == old_snapshot.stdout.replace(old_entry, new_entry, 1)
                      and unchanged_home_assets_and_benchmark
                  )
              shared = manifest.get("schema_version") == 1 and manifest.get("route_count") == 500 and len(manifest.get("outputs", {})) == 501 and len(manifest.get("managed_sources", [])) == 494 and bool(shared_changed) and shared_changed <= shared_owned and benchmark_stable
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("required=" + ("false" if focused or shared else "true") + "\n")
          if focused:
              print("NOT RUN: 24-run benchmark; reviewed SEO-only content scope. No new performance result is claimed.")
          elif shared:
              print("NOT RUN: owner-requested focused SharedBrand checks replace the repeated 24-run benchmark. Native module checks remain required; no new performance result is claimed.")
          PY
      - name: Install pinned performance runtime
        if: steps.performance_scope.outputs.required == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/3dkan-native-qa" --no-audit --no-fund lighthouse@13.5.0 puppeteer-core@25.13.0
          mkdir -p artifacts/performance
          cp "$RUNNER_TEMP/3dkan-native-qa/package-lock.json" artifacts/performance/runtime-package-lock.json
      - name: Measure first-party baseline and candidate performance
        if: steps.performance_scope.outputs.required == 'true'
        timeout-minutes: 30
        run: |
          node --check tests/performance.cjs
          node tests/performance.cjs
      - name: Save raw performance reports and comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-${{ github.event.pull_request.head.sha }}
          path: artifacts/performance
          if-no-files-found: warn
          retention-days: 7
      - name: Save native reports, screenshots, PDFs and verified public fixture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qa-${{ github.event.pull_request.head.sha }}
          path: artifacts/native-qa
          if-no-files-found: warn
          retention-days: 7
