name: Import Website from Rumahweb

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-from-rumahweb.yml'

permissions:
  contents: write

concurrency:
  group: rumahweb-production
  cancel-in-progress: false

jobs:
  import:
    name: Import public_html to GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install FTPS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp rsync

      - name: Download public_html from Rumahweb
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          rm -rf /tmp/rumahweb-site
          mkdir -p /tmp/rumahweb-site

          lftp -u "${FTP_USERNAME},${FTP_PASSWORD}" "ftp://${FTP_SERVER}:21" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:timeout 20;

            mirror \
              --verbose \
              --parallel=4 \
              --exclude-glob '.git*' \
              --exclude-glob '.env' \
              --exclude-glob '.env.*' \
              --exclude-glob 'wp-config.php' \
              --exclude-glob 'configuration.php' \
              --exclude-glob 'error_log' \
              --exclude-glob '*.log' \
              --exclude-glob '*.zip' \
              --exclude-glob '*.tar' \
              --exclude-glob '*.tar.gz' \
              --exclude-glob '*.sql' \
              --exclude-glob '*.sql.gz' \
              public_html/ /tmp/rumahweb-site/;

            bye
          "

      - name: Verify downloaded site
        run: |
          test -d /tmp/rumahweb-site
          FILE_COUNT="$(find /tmp/rumahweb-site -type f | wc -l)"
          echo "Downloaded files: $FILE_COUNT"
          if [ "$FILE_COUNT" -lt 2 ]; then
            echo "Import dibatalkan: isi public_html tampak kosong atau path FTPS salah."
            exit 1
          fi

      - name: Synchronize website into repository
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='.site-source-ready' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='wp-config.php' \
            --exclude='configuration.php' \
            --exclude='error_log' \
            --exclude='*.log' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.sql' \
            --exclude='*.sql.gz' \
            /tmp/rumahweb-site/ ./

      - name: Protect sensitive files from Git
        run: |
          cat >> .gitignore <<'EOF'

          # Rumahweb / production secrets
          .env
          .env.*
          !.env.example
          wp-config.php
          configuration.php
          error_log
          *.log
          *.sql
          *.sql.gz
          *.zip
          *.tar
          *.tar.gz
          EOF

          sort -u .gitignore -o .gitignore

      - name: Mark repository as initialized
        run: |
          echo "Website source imported from Rumahweb." > .site-source-ready

      - name: Commit imported website
        run: |
          git config user.name "Rumahweb Sync Bot"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan dari Rumahweb."
            exit 0
          fi

          git commit -m "Sync website from Rumahweb public_html"
          git push origin HEAD:main
