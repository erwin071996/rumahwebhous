name: Deploy to Rumahweb via FTPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rumahweb-production
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Deploy Website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate complete website source
        run: python scripts/check_site.py
      - name: Verify drift refusal and failed-upload rollback before deployment
        run: python -m unittest discover -s tests -v
      - name: Check PHP syntax
        run: find public_html -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify baseline or deploy reviewed changes with rollback
        env:
          FTP_SERVER: kilimanjaro.iixcp.rumahweb.net
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/deploy_ftps.py
      - name: Save deployment evidence and changed-file rollback copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rumahweb-deployment-${{ github.run_id }}
          path: deployment-result/
          if-no-files-found: ignore
          retention-days: 14
