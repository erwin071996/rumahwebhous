<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Membedakan diameter dan keliling neon box bulat</title><desc id="desc">Skema konsep. Muka: nyatakan diameter bidang tampilan yang diinginkan. Samping: pisahkan tebal badan kotak dari ukuran muka. Dudukan: minta gambar keseluruhan yang menunjukkan bagian penyangga bila papan dipasang menonjol.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">UKURAN &amp; PROPORSI</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Membedakan diameter dan keliling neon box bulat</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><circle cx="280" cy="385" r="125" fill="white" stroke="#147d77" stroke-width="5"/><line x1="155" y1="385" x2="405" y2="385" stroke="#f67a45" stroke-width="4" /><circle cx="280" cy="385" r="5" fill="#142c3b"/><text x="280" y="425" fill="#142c3b" font-size="20" font-weight="600" text-anchor="middle">Diameter melewati pusat</text><text x="280" y="555" fill="#526a75" font-size="21" font-weight="500" text-anchor="middle">Tebal badan = ukuran lain</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Muka</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">nyatakan diameter bidang tampilan yang</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">diinginkan.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Samping</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pisahkan tebal badan kotak dari ukuran muka.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Dudukan</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">minta gambar keseluruhan yang menunjukkan bagian</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">penyangga bila papan dipasang menonjol.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>