<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Memeriksa fungsi lampu melalui petugas yang kompeten</title><desc id="desc">Skema konsep. Persiapan: minta pembuat atau installer menyiapkan pengujian sesuai prosedur. Pengamatan: lihat apakah seluruh bagian yang disepakati menyala dan kendali berfungsi normal. Dokumentasi: catat temuan serta kondisi pengujian untuk tindak lanjut.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">PEMERIKSAAN &amp; SERAH TERIMA</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Memeriksa fungsi lampu melalui petugas yang kompeten</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="86" y="233" width="415" height="401" rx="16" fill="white" stroke="#c6d3d0" stroke-width="2"/><text x="117" y="279" fill="#142c3b" font-size="22" font-weight="750" text-anchor="start">SPESIFIKASI / CATATAN</text><rect x="112" y="305" width="30" height="30" rx="3" fill="#eef5f3" stroke="#147d77" stroke-width="2"/><text x="161" y="330" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Ejaan &amp; jumlah</text><line x1="158" y1="349" x2="468" y2="349" stroke="#d0ddd8" stroke-width="1" /><rect x="112" y="374" width="30" height="30" rx="3" fill="#eef5f3" stroke="#147d77" stroke-width="2"/><text x="161" y="399" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Ukuran acuan</text><line x1="158" y1="418" x2="468" y2="418" stroke="#d0ddd8" stroke-width="1" /><rect x="112" y="443" width="30" height="30" rx="3" fill="#eef5f3" stroke="#147d77" stroke-width="2"/><text x="161" y="468" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Kondisi visual</text><line x1="158" y1="487" x2="468" y2="487" stroke="#d0ddd8" stroke-width="1" /><rect x="112" y="512" width="30" height="30" rx="3" fill="#eef5f3" stroke="#147d77" stroke-width="2"/><text x="161" y="537" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Temuan &amp; tindak lanjut</text><line x1="158" y1="556" x2="468" y2="556" stroke="#d0ddd8" stroke-width="1" /><text x="290" y="670" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Jangan tandai sebelum diperiksa.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Persiapan</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">minta pembuat atau installer menyiapkan</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pengujian sesuai prosedur.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Pengamatan</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">lihat apakah seluruh bagian yang disepakati</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">menyala dan kendali berfungsi normal.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Dokumentasi</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">catat temuan serta kondisi pengujian untuk</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">tindak lanjut.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>