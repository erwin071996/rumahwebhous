<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Memperkirakan lebar tulisan panjang sebelum desain final</title><desc id="desc">Skema konsep. Isi: pastikan teks sudah final dan spasi ditulis sesuai kebutuhan. Desain: bandingkan beberapa susunan menggunakan jenis huruf yang benar. Ukuran: ukur kotak keseluruhan, kemudian cocokkan dengan area efektif bidang.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">UKURAN &amp; PROPORSI</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Memperkirakan lebar tulisan panjang sebelum desain final</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="78" y="275" width="420" height="230" rx="6" fill="#d4e4e0" stroke="#147d77" stroke-width="2"/><rect x="122" y="315" width="330" height="150" rx="4" fill="#142c3b" stroke="none" stroke-width="2"/><text x="287" y="402" fill="white" font-size="36" font-weight="800" text-anchor="middle">TULISAN</text><line x1="78" y1="246" x2="498" y2="246" stroke="#f67a45" stroke-width="3" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/><text x="288" y="229" fill="#142c3b" font-size="19" font-weight="700" text-anchor="middle">LEBAR BIDANG</text><line x1="122" y1="542" x2="452" y2="542" stroke="#147d77" stroke-width="3" marker-start="url(#arrowStart)" marker-end="url(#arrow)"/><text x="287" y="576" fill="#142c3b" font-size="19" font-weight="700" text-anchor="middle">LEBAR TULISAN</text><text x="288" y="628" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Beri satuan. Bedakan ukur &amp; perkiraan.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Isi</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pastikan teks sudah final dan spasi ditulis</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">sesuai kebutuhan.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Desain</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">bandingkan beberapa susunan menggunakan jenis</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">huruf yang benar.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Ukuran</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">ukur kotak keseluruhan, kemudian cocokkan dengan</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">area efektif bidang.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>