<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Memeriksa tautan setelah perubahan nama halaman</title><desc id="desc">Skema konsep. Inventaris: catat URL lama yang masih dipakai pada media publik. Tujuan: pilih halaman pengganti yang benar-benar sepadan atau jelaskan perubahan. Uji: buka tautan lama dan periksa hasil, termasuk parameter yang perlu dipertahankan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">MARKETING &amp; PERJALANAN PELANGGAN</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Memeriksa tautan setelah perubahan nama halaman</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="102" y="230" width="377" height="109" rx="16" fill="#dcece3" stroke="none" stroke-width="2"/><text x="290" y="273" fill="#142c3b" font-size="25" font-weight="800" text-anchor="middle">PAPAN</text><text x="290" y="309" fill="#526a75" font-size="20" font-weight="500" text-anchor="middle">Dikenali</text><line x1="290" y1="343" x2="290" y2="369" stroke="#147d77" stroke-width="3" marker-end="url(#arrow)"/><rect x="102" y="375" width="377" height="109" rx="16" fill="#dcece3" stroke="none" stroke-width="2"/><text x="290" y="418" fill="#142c3b" font-size="25" font-weight="800" text-anchor="middle">WEBSITE</text><text x="290" y="454" fill="#526a75" font-size="20" font-weight="500" text-anchor="middle">Dipahami</text><line x1="290" y1="488" x2="290" y2="514" stroke="#147d77" stroke-width="3" marker-end="url(#arrow)"/><rect x="102" y="520" width="377" height="109" rx="16" fill="#142c3b" stroke="none" stroke-width="2"/><text x="290" y="563" fill="white" font-size="25" font-weight="800" text-anchor="middle">KONTAK</text><text x="290" y="599" fill="#b7e0d0" font-size="20" font-weight="500" text-anchor="middle">Dikonsultasikan</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Inventaris</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">catat URL lama yang masih dipakai pada media</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">publik.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Tujuan</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pilih halaman pengganti yang benar-benar sepadan</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">atau jelaskan perubahan.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Uji</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">buka tautan lama dan periksa hasil, termasuk</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">parameter yang perlu dipertahankan.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>