<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Membedakan kebutuhan identitas usaha dan papan promosi</title><desc id="desc">Skema konsep. Inventaris: tandai informasi yang tetap dan yang mungkin berubah dalam beberapa bulan. Pemisahan: tempatkan identitas pada bagian utama, lalu sediakan media terpisah untuk promo. Perawatan: tanyakan cara mengganti materi promo tanpa membuka komponen papan permanen.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">MULAI DARI KEBUTUHAN</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Membedakan kebutuhan identitas usaha dan papan promosi</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="115" y="240" width="345" height="330" rx="2" fill="#edf2ef" stroke="#147d77" stroke-width="2"/><rect x="135" y="263" width="305" height="88" rx="10" fill="#142c3b" stroke="none" stroke-width="2"/><text x="287.5" y="311.4" fill="#ffffff" font-size="34" font-weight="800" text-anchor="middle">NAMA TOKO</text><rect x="147" y="380" width="138" height="175" rx="2" fill="#b6d4d1" stroke="#147d77" stroke-width="2"/><rect x="308" y="381" width="103" height="100" rx="2" fill="#e0cbab" stroke="none" stroke-width="2"/><line x1="83" y1="572" x2="508" y2="572" stroke="#526a75" stroke-width="3" /><line x1="102" y1="628" x2="360" y2="628" stroke="#147d77" stroke-width="3" marker-end="url(#arrow)"/><text x="295" y="222" fill="#142c3b" font-size="16" font-weight="700" text-anchor="middle">LIHAT BIDANG + LINGKUNGANNYA</text><text x="291" y="673" fill="#526a75" font-size="20" font-weight="500" text-anchor="middle">Arah datang pengunjung</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Inventaris</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">tandai informasi yang tetap dan yang mungkin</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">berubah dalam beberapa bulan.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Pemisahan</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">tempatkan identitas pada bagian utama, lalu</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">sediakan media terpisah untuk promo.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Perawatan</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">tanyakan cara mengganti materi promo tanpa</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">membuka komponen papan permanen.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>