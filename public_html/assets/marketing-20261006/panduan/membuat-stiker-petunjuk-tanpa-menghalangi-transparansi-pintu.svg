<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Membuat stiker petunjuk tanpa menghalangi transparansi pintu</title><desc id="desc">Skema konsep. Fungsi: bedakan petunjuk dorong-tarik, logo, jadwal, dan dekorasi. Posisi: letakkan informasi pada area yang mudah dikenali tanpa menutup seluruh pandangan yang diperlukan. Pemeriksaan: uji ketika pintu dibuka serta ketika orang mendekat dari kedua sisi.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">STIKER CUTTING &amp; KACA</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Membuat stiker petunjuk tanpa menghalangi transparansi pintu</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="90" y="237" width="395" height="375" rx="3" fill="#d9e7e4" stroke="#147d77" stroke-width="2"/><line x1="284" y1="238" x2="284" y2="612" stroke="#147d77" stroke-width="6" /><line x1="91" y1="510" x2="483" y2="510" stroke="#147d77" stroke-width="4" /><rect x="126" y="327" width="125" height="73" rx="2" fill="#142c3b" stroke="none" stroke-width="2"/><text x="188" y="373" fill="white" font-size="30" font-weight="700" text-anchor="middle">BUKA</text><rect x="317" y="340" width="120" height="128" rx="2" fill="#faf6e9" stroke="none" stroke-width="2"/><text x="377" y="385" fill="#142c3b" font-size="26" font-weight="700" text-anchor="middle">LOGO</text><line x1="368" y1="450" x2="368" y2="500" stroke="#147d77" stroke-width="3" marker-end="url(#arrow)"/><text x="288" y="664" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Cek sisi baca, kusen, dan pintu bergerak.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Fungsi</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">bedakan petunjuk dorong-tarik, logo, jadwal, dan</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">dekorasi.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Posisi</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">letakkan informasi pada area yang mudah dikenali</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">tanpa menutup seluruh pandangan yang diperlukan.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Pemeriksaan</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">uji ketika pintu dibuka serta ketika orang</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">mendekat dari kedua sisi.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>