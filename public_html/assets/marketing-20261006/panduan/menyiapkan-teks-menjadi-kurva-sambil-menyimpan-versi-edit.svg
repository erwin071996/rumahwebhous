<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Menyiapkan teks menjadi kurva sambil menyimpan versi edit</title><desc id="desc">Skema konsep. Cadangan: simpan file dengan teks aktif dan beri nama yang jelas. Salinan: buat versi produksi lalu ubah teks menjadi bentuk melalui fungsi aplikasi yang sesuai. Pemeriksaan: cocokkan ejaan, jarak, serta pemenggalan baris setelah diekspor.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">FILE DESAIN SIAP DIPERIKSA</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Menyiapkan teks menjadi kurva sambil menyimpan versi edit</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="80" y="250" width="418" height="166" rx="16" fill="white" stroke="#bfcfca" stroke-width="2"/><text x="110" y="288" fill="#526a75" font-size="19" font-weight="700" text-anchor="start">RASTER: PIKSEL</text><rect x="149" y="306" width="33" height="14" rx="0" fill="#147d77" stroke="none" stroke-width="2"/><rect x="186" y="306" wid