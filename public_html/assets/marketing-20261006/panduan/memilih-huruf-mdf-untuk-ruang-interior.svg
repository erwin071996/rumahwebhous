<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Memilih huruf MDF untuk ruang interior</title><desc id="desc">Skema konsep. Lokasi: catat apakah bidang berada di ruang kering, dekat area basah, atau terpapar cuaca. Produk: minta identitas papan serta finishing yang sesuai peruntukan. Detail: periksa tepi, sisi belakang, dan metode pemasangan yang termasuk lingkup pesanan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">BAHAN &amp; DISPLAY INTERIOR</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Memilih huruf MDF untuk ruang interior</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><path d="M78 287l300 -30 80 48 -300 30z" fill="#142c3b" stroke="#527b77" stroke-width="2"/><text x="93" y="367" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Muka dekoratif</text><path d="M110 392l300 -30 80 48 -300 30z" fill="#a5c8bd" stroke="#527b77" stroke-width="2"/><text x="125" y="472" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Inti: pastikan jenisnya</text><path d="M142 497l300 -30 80 48 -300 30z" fill="#147d77" stroke="#527b77" stroke-width="2"/><text x="157" y="577" fill="#142c3b" font-size="21" font-weight="600" text-anchor="start">Belakang / bidang</text><text x="288" y="662" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Skema lapisan, bukan ukuran konstruksi.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Lokasi</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">catat apakah bidang berada di ruang kering,</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">dekat area basah, atau terpapar cuaca.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Produk</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">minta identitas papan serta finishing yang</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">sesuai peruntukan.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Detail</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">periksa tepi, sisi belakang, dan metode</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pemasangan yang termasuk lingkup pesanan.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>