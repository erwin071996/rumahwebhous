<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Menentukan apakah neon flex perlu portabel</title><desc id="desc">Skema konsep. Skenario: catat frekuensi pemindahan dan jenis lokasi pemakaian. Angkutan: ukur ruang penyimpanan serta ukuran paket yang dapat dibawa. Operasi: minta petunjuk penempatan dan penggunaan yang sesuai tanpa perubahan rangkaian oleh pengguna.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">NEON FLEX &amp; DEKORASI</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Menentukan apakah neon flex perlu portabel</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="78" y="230" width="420" height="365" rx="16" fill="#142c3b" stroke="none" stroke-width="2"/><path d="M127 493C143 345 236 307 262 382S390 519 435 306" fill="none" stroke="#ffbe92" stroke-width="26" opacity=".2"/><path d="M127 493C143 345 236 307 262 382S390 519 435 306" fill="none" stroke="#ffae80" stroke-width="10" stroke-linecap="round"/><text x="290" y="550" fill="white" font-size="19" font-weight="700" text-anchor="middle">JALUR SESUAI SERI</text><text x="288" y="645" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Arah tekuk &amp; titik potong: cek datasheet.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Skenario</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">catat frekuensi pemindahan dan jenis lokasi</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pemakaian.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Angkutan</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">ukur ruang penyimpanan serta ukuran paket yang</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">dapat dibawa.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Operasi</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">minta petunjuk penempatan dan penggunaan yang</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">sesuai tanpa perubahan rangkaian oleh pengguna.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>