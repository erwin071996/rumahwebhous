<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Menggunakan aksen warna pada tombol dan papan informasi</title><desc id="desc">Skema konsep. Tugas: pilih informasi atau tindakan yang perlu mendapat perhatian pertama. Konsistensi: gunakan aksen yang sama untuk fungsi yang sama pada media sejenis. Pembacaan: tetap beri teks atau simbol yang jelas, jangan mengandalkan warna saja.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">WARNA &amp; KOMPOSISI</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Menggunakan aksen warna pada tombol dan papan informasi</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="78" y="238" width="205" height="160" rx="16" fill="#142c3b" stroke="none" stroke-width="2"/><text x="180" y="326" fill="#fff" font-size="64" font-weight="800" text-anchor="middle">Aa</text><text x="180" y="374" fill="#fff" font-size="16" font-weight="500" text-anchor="middle">Latar gelap</text><rect x="298" y="238" width="205" height="160" rx="16" fill="#faf4e8" stroke="none" stroke-width="2"/><text x="400" y="326" fill="#142c3b" font-size="64" font-weight="800" text-anchor="middle">Aa</text><text x="400" y="374" fill="#142c3b" font-size="16" font-weight="500" text-anchor="middle">Latar terang</text><rect x="78" y="423" width="205" height="160" rx="16" fill="#13776e" stroke="none" stroke-width="2"/><text x="180" y="511" fill="#fff" font-size="64" font-weight="800" text-anchor="middle">Aa</text><text x="180" y="559" fill="#fff" font-size="16" font-weight="500" text-anchor="middle">Uji pasangan</text><rect x="298" y="423" width="205" height="160" rx="16" fill="#edddc4" stroke="none" stroke-width="2"/><text x="400" y="511" fill="#715740" font-size="64" font-weight="800" text-anchor="middle">Aa</text><text x="400" y="559" fill="#715740" font-size="16" font-weight="500" text-anchor="middle">Periksa konteks</text><text x="288" y="630" fill="#526a75" font-size="19" font-weight="500" text-anchor="middle">Bandingkan pada cahaya yang sama.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Tugas</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pilih informasi atau tindakan yang perlu</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">mendapat perhatian pertama.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Konsistensi</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">gunakan aksen yang sama untuk fungsi yang sama</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pada media sejenis.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Pembacaan</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">tetap beri teks atau simbol yang jelas, jangan</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">mengandalkan warna saja.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>