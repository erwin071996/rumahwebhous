<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Membedakan muka stainless dan huruf seluruh badan stainless</title><desc id="desc">Skema konsep. Penampang: minta gambar muka, dinding, belakang, dan alas bila ada. Bahan: sebutkan material masing-masing bagian pada penawaran. Tampilan: periksa sampel dari samping, bukan hanya dari arah depan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">STAINLESS &amp; FINISHING</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Membedakan muka stainless dan huruf seluruh badan stainless</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="78" y="247" width="190" height="300" rx="16" fill="#d2dce0" stroke="#a5b6bb" stroke-width="2"/><rect x="293" y="247" width="205" height="300" rx="16" fill="url(#metal)" stroke="#a5b6bb" stroke-width="2"/><line x1="94" y1="267" x2="94" y2="526" stroke="#94a4ac" stroke-width="1" /><line x1="106" y1="267" x2="106" y2="526" stroke="#94a4ac" stroke-width="1" /><line x1=