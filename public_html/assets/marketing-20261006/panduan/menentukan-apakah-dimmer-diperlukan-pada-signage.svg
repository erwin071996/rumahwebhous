<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Menentukan apakah dimmer diperlukan pada signage</title><desc id="desc">Skema konsep. Skenario: jelaskan kapan cahaya perlu diredupkan dan siapa yang akan mengaturnya. Kecocokan: minta pembuat memastikan jenis kendali yang didukung semua komponen. Penggunaan: simpan petunjuk pengaturan normal serta batas yang diperbolehkan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">LAMPU &amp; PENGGUNAAN ENERGI</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Menentukan apakah dimmer diperlukan pada signage</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="98" y="224" width="378" height="102" rx="16" fill="#dfede6" stroke="none" stroke-width="2"/><text x="288" y="266" fill="#142c3b" font-size="22" font-weight="700" text-anchor="middle">DATA LABEL</text><text x="288" y="299" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Model &amp; keluaran</text><line x1="288" y1="329" x2="288" y2="354" stroke="#147d77" stroke-width="3" marker-end="url(#arrow)"/><rect x="98" y="361" width="378" height="102" rx="16" fill="#142c3b" stroke="none" stroke-width="2"/><text x="288" y="403" fill="white" font-size="22" font-weight="700" text-anchor="middle">LAMPU</text><text x="288" y="436" fill="#b7dfd1" font-size="18" font-weight="500" text-anchor="middle">Kebutuhan sesuai</text><line x1="288" y1="466" x2="288" y2="491" stroke="#147d77" stroke-width="3" marker-end="url(#arrow)"/><rect x="98" y="498" width="378" height="102" rx="16" fill="#dfede6" stroke="none" stroke-width="2"/><text x="288" y="540" fill="#142c3b" font-size="22" font-weight="700" text-anchor="middle">OPERASI</text><text x="288" y="573" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Jam &amp; kendali</text><text x="288" y="670" fill="#526a75" font-size="17" font-weight="500" text-anchor="middle">Alur pemilihan, BUKAN diagram kabel.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Skenario</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">jelaskan kapan cahaya perlu diredupkan dan siapa</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">yang akan mengaturnya.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Kecocokan</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">minta pembuat memastikan jenis kendali yang</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">didukung semua komponen.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Penggunaan</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">simpan petunjuk pengaturan normal serta batas</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">yang diperbolehkan.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>