<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Membandingkan kondisi signage dengan foto awal secara wajar</title><desc id="desc">Skema konsep. Acuan: pilih foto awal yang memperlihatkan bagian relevan dengan jelas. Pengambilan: buat foto baru dari sudut serta kondisi cahaya yang mendekati. Catatan: jelaskan perubahan fisik yang diketahui dan waktu mulai terlihat.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto"><path d="M8 0L0 4 8 8" fill="none" stroke="#147d77" stroke-width="1.8"/></marker><linearGradient id="metal"><stop stop-color="#f5f9f9"/><stop offset=".43" stop-color="#abbcc3"/><stop offset=".55" stop-color="#e4eded"/><stop offset="1" stop-color="#8c9faa"/></linearGradient></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="820" rx="0" fill="#f4f3ed" stroke="none" stroke-width="2"/><text x="46" y="45" fill="#147d77" font-size="19" font-weight="800" text-anchor="start">3DKAN / PANDUAN VISUAL</text><text x="1152" y="45" fill="#526a75" font-size="16" font-weight="600" text-anchor="end">PERAWATAN &amp; SERVIS</text><text x="46" y="94.0" fill="#142c3b" font-size="30" font-weight="500" text-anchor="start">Membandingkan kondisi signage dengan foto awal secara wajar</text><rect x="45" y="196" width="485" height="535" rx="24" fill="#e8eee8" stroke="none" stroke-width="2"/><rect x="91" y="240" width="403" height="355" rx="16" fill="white" stroke="#c4d6cd" stroke-width="2"/><rect x="91" y="240" width="403" height="68" rx="0" fill="#142c3b" stroke="none" stroke-width="2"/><text x="292" y="282" fill="white" font-size="24" font-weight="700" text-anchor="middle">CATAT KONDISI</text><circle cx="129" cy="351" r="7" fill="#147d77"/><text x="158" y="356.0" fill="#142c3b" font-size="21" font-weight="500" text-anchor="start">Tanggal &amp; titik</text><circle cx="129" cy="439" r="7" fill="#147d77"/><text x="158" y="444.0" fill="#142c3b" font-size="21" font-weight="500" text-anchor="start">Temuan dari posisi aman</text><circle cx="129" cy="527" r="7" fill="#147d77"/><text x="158" y="532.0" fill="#142c3b" font-size="21" font-weight="500" text-anchor="start">Arahan pembuat / teknisi</text><text x="290" y="651" fill="#526a75" font-size="18" font-weight="500" text-anchor="middle">Jangan membuka rangkaian sendiri.</text><rect x="559" y="204" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="238" r="16" fill="#147d77"/><text x="595" y="245" fill="white" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="624" y="245" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Acuan</text><text x="586" y="282.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">pilih foto awal yang memperlihatkan bagian</text><text x="586" y="309.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">relevan dengan jelas.</text><rect x="559" y="372" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="406" r="16" fill="#147d77"/><text x="595" y="413" fill="white" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="624" y="413" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Pengambilan</text><text x="586" y="450.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">buat foto baru dari sudut serta kondisi cahaya</text><text x="586" y="477.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">yang mendekati.</text><rect x="559" y="540" width="593" height="151" rx="18" fill="white" stroke="none" stroke-width="2"/><circle cx="595" cy="574" r="16" fill="#147d77"/><text x="595" y="581" fill="white" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="624" y="581" fill="#142c3b" font-size="23" font-weight="750" text-anchor="start">Catatan</text><text x="586" y="618.0" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">jelaskan perubahan fisik yang diketahui dan</text><text x="586" y="645.3" fill="#526a75" font-size="21" font-weight="500" text-anchor="start">waktu mulai terlihat.</text><text x="46" y="782" fill="#526a75" font-size="19" font-weight="500" text-anchor="start">Skema edukasi • Tidak berskala • Bukan petunjuk konstruksi atau sambungan listrik</text></g></svg>